      { id: "39", quarter: "चतुर्थ चरण (पाठ ३७-४८: सम्भावना, शर्त, प्रत्यय एवं गहन सांस्कृतिक मुहावरे)", file: "md/ep39.md", title: "पाठ ३९: अपूर्ण इच्छाएँ", words: "९५१–९७५", grammar: "हेतुहेतुमद्भूत - 'अगर पढ़ते, तो उत्तीर्ण होते'", ready: false },
      { id: "40", quarter: "चतुर्थ चरण (पाठ ३७-४८: सम्भावना, शर्त, प्रत्यय एवं गहन सांस्कृतिक मुहावरे)", file: "md/ep40.md", title: "पाठ ४०: व्यक्ति और संबंध", words: "९७६–१०००", grammar: "संबन्धवाचक सह-संबन्ध - 'जो... वो... / जिसे... उसे...'", ready: false },
      { id: "41", quarter: "चतुर्थ चरण (पाठ ३७-४८: सम्भावना, शर्त, प्रत्यय एवं गहन सांस्कृतिक मुहावरे)", file: "md/ep41.md", title: "पाठ ४१: स्थान और दिशा", words: "१००१–१०२५", grammar: "स्थानवाचक सह-संबन्ध - 'जहाँ... वहाँ...'", ready: false },
      { id: "42", quarter: "चतुर्थ चरण (पाठ ३७-४८: सम्भावना, शर्त, प्रत्यय एवं गहन सांस्कृतिक मुहावरे)", file: "md/ep42.md", title: "पाठ ४२: काल और क्षण", words: "१०२६–१०५०", grammar: "कालवाचक सह-संबन्ध - 'जब... तब... / जैसे ही... वैसे ही...'", ready: false },
      { id: "43", quarter: "चतुर्थ चरण (पाठ ३७-४८: सम्भावना, शर्त, प्रत्यय एवं गहन सांस्कृतिक मुहावरे)", file: "md/ep43.md", title: "पाठ ४३: रीति और परिमाण", words: "१०५१–१०७५", grammar: "रीतिवाचक सह-संबन्ध - 'जैसा... वैसा... / जितना... उतना...'", ready: false },
      { id: "44", quarter: "चतुर्थ चरण (पाठ ३७-४८: सम्भावना, शर्त, प्रत्यय एवं गहन सांस्कृतिक मुहावरे)", file: "md/ep44.md", title: "पाठ ४४: भाव और विचार", words: "१०७६–११००", grammar: "भाववाचक संज्ञा प्रत्यय - '-ता' (सुंदरता, मानवता)", ready: false },
      { id: "45", quarter: "चतुर्थ चरण (पाठ ३७-४८: सम्भावना, शर्त, प्रत्यय एवं गहन सांस्कृतिक मुहावरे)", file: "md/ep45.md", title: "पाठ ४५: बचपन और अपनापन", words: "११०१–११२५", grammar: "भाववाचक संज्ञा प्रत्यय - '-पन' (बचपन, पागलपन)", ready: false },
      { id: "46", quarter: "चतुर्थ चरण (पाठ ३७-४८: सम्भावना, शर्त, प्रत्यय एवं गहन सांस्कृतिक मुहावरे)", file: "md/ep46.md", title: "पाठ ४६: सामाजिक गरिमा", words: "११२६–११५०", grammar: "आदरार्थी बहुवचन और आदर-सूचक क्रियाएँ", ready: false },
      { id: "47", quarter: "चतुर्थ चरण (पाठ ३७-४८: सम्भावना, शर्त, प्रत्यय एवं गहन सांस्कृतिक मुहावरे)", file: "md/ep47.md", title: "पाठ ४७: दार्शनिक चिंतन", words: "११५१–११७५", grammar: "गहन वाक्य रचना और संश्लिष्ट संयोजक (यद्यपि... तथापि...)", ready: false },
      { id: "48", quarter: "चतुर्थ चरण (पाठ ३७-४८: सम्भावना, शर्त, प्रत्यय एवं गहन सांस्कृतिक मुहावरे)", file: "md/ep48.md", title: "पाठ ४८: भाषा का माधुर्य", words: "११७६–१२००", grammar: "सांस्कृतिक बारीकियों और पूर्ण संवाद प्रवाह का शिखर", ready: false }
    ];

    let currentEpisode = episodes[0];
    let currentRawMarkdown = "";
    const renderer = new SimpleMarkdownRenderer();

    const episodeListEl = document.getElementById('episode-list');
    const contentAreaEl = document.getElementById('content-area');
    const currentTitleEl = document.getElementById('current-title');
    const currentMetaEl = document.getElementById('current-meta');
    const rawLinkEl = document.getElementById('raw-link');
    const copyBtnEl = document.getElementById('copy-btn');
    const searchInput = document.getElementById('search-input');

    function renderSidebar(filteredEpisodes = episodes) {
      episodeListEl.innerHTML = '';
      let currentQuarter = '';

      filteredEpisodes.forEach(ep => {
        if (ep.quarter !== currentQuarter) {
          currentQuarter = ep.quarter;
          const qLi = document.createElement('li');
          qLi.className = 'quarter-header';
          qLi.textContent = currentQuarter;
          episodeListEl.appendChild(qLi);
        }

        const li = document.createElement('li');
        li.className = `episode-item ${ep.id === currentEpisode.id ? 'active' : ''}`;
        li.innerHTML = `
          <div class="episode-title">${ep.title}</div>
          <div class="episode-subtitle">शब्द: ${ep.words} ${ep.ready ? '✅' : '⏳'}</div>
        `;

        li.addEventListener('click', () => {
          loadEpisode(ep);
        });

        episodeListEl.appendChild(li);
      });
    }

    async function loadEpisode(ep) {
      currentEpisode = ep;
      currentTitleEl.textContent = ep.title;
      currentMetaEl.textContent = `शब्द: ${ep.words} | व्याकरण: ${ep.grammar}`;
      rawLinkEl.href = ep.file;
      rawLinkEl.setAttribute('download', `ep${ep.id}.md`);

      renderSidebar();

      contentAreaEl.innerHTML = `
        <div class="loading-box">
          <div class="spinner"></div>
          <p>${ep.title} की सामग्री लोड हो रही है...</p>
        </div>
      `;

      try {
        const response = await fetch(ep.file);
        if (!response.ok) {
          throw new Error('सामग्री अभी उपलब्ध नहीं है');
        }
        const markdown = await response.text();
        currentRawMarkdown = markdown;
        contentAreaEl.innerHTML = renderer.render(markdown);
      } catch (err) {
        contentAreaEl.innerHTML = `
          <div class="loading-box">
            <h3>⚠️ यह पाठ आगामी बैच में तैयार किया जाएगा</h3>
            <p>यह पाठ (${ep.title}) पाठ्यचर्या का भाग है और शीघ्र ही जोड़ा जा रहा है।</p>
          </div>
        `;
      }
    }

    // Copy Raw Markdown
    copyBtnEl.addEventListener('click', () => {
      if (!currentRawMarkdown) return;
      navigator.clipboard.writeText(currentRawMarkdown).then(() => {
        const origText = copyBtnEl.textContent;
        copyBtnEl.textContent = "✅ कॉपी हो गया!";
        setTimeout(() => { copyBtnEl.textContent = origText; }, 2000);
      });
    });

    // Search filter
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = episodes.filter(ep => 
        ep.title.toLowerCase().includes(q) || 
        ep.words.includes(q) || 
        ep.grammar.toLowerCase().includes(q)
      );
      renderSidebar(filtered);
    });

    // Initialize
    loadEpisode(currentEpisode);
  </script>
